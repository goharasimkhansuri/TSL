A:['Tawajjuh',[['توجہ جلد ہٹ جاتی ہے یا آسانی سے بھٹک جاتا/جاتی ہے','Easily distracted; attention drifts quickly'],['کام شروع کر کے ادھورا چھوڑ دیتا/دیتی ہے','Starts but fails to finish tasks'],['بے چین رہتا/رہتی ہے، بیٹھنا ہو تو بار بار اٹھ جاتا/جاتی ہے','Fidgets or leaves seat when expected to stay seated']],'توجہ','Attention'],

N:['Dilchaspi',[['پڑھائی میں دلچسپی کم لیتا/لیتی ہے','Shows little interest in academic work'],['گھر کا کام مکمل نہیں کرتا/کرتی','Does not complete homework'],['عملی سرگرمیوں میں بھی دلچسپی نہیں لیتا/لیتی','Shows little interest even in hands-on activities']],'دلچسپی','Interest / Engagement'],
E:['Sehat/Mahol',[['دور سے دیکھنے میں دشواری، آنکھیں ملنا یا سر درد کی شکایت','Difficulty seeing at a distance, eye rubbing or headache complaints'],['آواز کم سنتا/سنتی ہے یا پکارنے پر جواب نہیں دیتا/دیتی','Seems to hear poorly or does not respond when called'],['گھر میں تناؤ، غربت، نیند یا غذا کی کمی','Home stress, poverty, or poor sleep/nutrition'],['اکثر غیر حاضر رہتا/رہتی ہے یا اسکول سے ڈرتا/ڈرتی ہے','Frequent absence or fear/avoidance of school']],'صحت / ماحول','Health / Environment']};

const VT={S:[['سست رفتار سیکھنے والا (ممکنہ)','Probable slow learner'],'#dc2626',['کئی تعلیمی شعبوں میں کمزوری، بشمول فہم؛ صرف ایک شعبے تک محدود نہیں۔','Weakness across several academic areas including comprehension, not limited to one area.']],
X:[['سست رفتار سیکھنے کے آثار + توجہ/رویے کا مسئلہ','Slow-learner indicators + attention/behaviour concerns'],'#9f1239',['تعلیمی کمزوری کے ساتھ توجہ یا رویے کے مسائل بھی ہیں۔','Academic weakness together with attention or behaviour concerns.']],
L:[['مخصوص سیکھنے کی مشکل کا امکان','Possible specific learning difficulty'],'#f59e0b',['کمزوری چند مخصوص شعبوں تک محدود ہے، باقی شعبے بہتر ہیں۔','Weakness is limited to specific areas; other areas are comparatively intact.']],
A:[['توجہ/رویے کا مسئلہ','Attention/behaviour concern'],'#3b82f6',['تعلیمی شعبے ٹھیک ہیں؛ مسئلہ توجہ یا رویے کا ہے۔','Academic areas are adequate; the concern is attention or behaviour.']],
M:[['دلچسپی/تحریک کا مسئلہ','Motivation/engagement concern'],'#8b5cf6',['صلاحیت ٹھیک مگر دلچسپی کم ہے۔','Ability appears adequate but engagement is low.']],

const ST={R:[['روزانہ 15 منٹ صوتیات (فونکس): حرف-آواز کے کھیل، کارڈز سے آوازیں جوڑنا','Daily 15-min phonics: letter-sound games, blending sounds with cards/objects'],['منظم ہجے/ڈی کوڈنگ مشق اور چھوٹے اقتباسات کی جوڑی میں بلند خوانی (روانی)','Structured decoding drills and paired repeated reading of short passages (fluency)'],['مطالعہ کی حکمتِ عملی: پیشگی جائزہ، نشان زد کرنا، ہر پیراگراف کا خلاصہ؛ آڈیو مدد','Reading strategies: preview, highlight, summarise each paragraph; audio support']],
W:[['ریت/ہوا میں حروف بنانا، پھر کاپی پر؛ روزانہ 10 منٹ مشق','Trace letters in sand/air, then on paper; 10 min daily practice'],['ہجے حصوں (syllables) میں سکھانا؛ جملہ بنانے کے سانچے دینا','Teach spelling by syllable chunks; give sentence frames for writing'],['خاکہ-مسودہ-نظرثانی گرافک آرگنائزر کے ساتھ؛ زبانی جواب یا ٹائپنگ کی اجازت','Plan-draft-revise with graphic organisers; allow oral or typed responses']],
M:[['ایک وقت میں ایک ہدایت، تصاویر کے ساتھ؛ نظم/تکرار سے یاد کرانا','One instruction at a time with pictures; rhymes and repetition to remember'],['مواد چھوٹے حصوں میں؛ وقفے وقفے سے دہرائی (اگلے دن، تیسرے اور ساتویں دن)','Chunk content; spaced review (next day, day 3, day 7)'],['خود امتحانی، یادداشت کے ہتھکنڈے (منموکس) اور تحریری چیک لسٹ','Self-quizzing (retrieval practice), mnemonics and written checklists']],
S:[['روزانہ گفتگو: تصویر بیان کرنا، کہانی دہرانا؛ درست جملے بول کر دکھانا','Daily talk time: describe pictures, retell stories; model correct sentences'],['نئے الفاظ پہلے سکھانا؛ بچے سے ہدایت اپنے الفاظ میں دہرانے کو کہنا','Pre-teach vocabulary; ask child to restate instructions in own words'],['جوڑی میں بحث، لکھنے سے پہلے زبانی خلاصہ؛ ہدایات تحریری شکل میں','Pair discussion and oral summary before writing; give written instructions']],
G:[['اشیاء سے گنتی (ٹھوس سے تصویری)؛ نمبر لائن کے کھیل','Counting with real objects (concrete to pictorial); number-line games'],['ٹھوس-تصویری-مجرد مراحل؛ حل شدہ مثالیں؛ ایک وقت میں ایک تصور اور روزانہ دہرائی','Concrete-pictorial-abstract steps; worked examples; one concept at a time with daily review'],['حقیقی زندگی (پیسے، ناپ تول) سے جوڑیں؛ مسئلہ مراحل میں توڑیں؛ پہلے بنیادی تصورات دہرائیں','Link to real life (money, measurement); break problems into steps; revisit prerequisites first']],
A:[['5-10 منٹ کے مختصر کام، حرکت کے وقفے، استاد کے قریب نشست، اسٹکر چارٹ','Short 5-10 min tasks, movement breaks, seat near teacher, sticker chart'],['روزانہ رپورٹ کارڈ (2-3 اہداف)؛ بصری ٹائمر؛ توجہ پر فوری تعریف','Daily report card (2-3 targets); visual timer; immediate praise for on-task behaviour'],['خود نگرانی چیک لسٹ، کام کو ٹکڑوں میں تقسیم اور مقررہ وقت، خلل کم کریں','Self-monitoring checklist; chunk tasks with deadlines; reduce distractions']],
B:[['تصویری 3 آسان قواعد؛ عمل پر فوراً تعریف','3 simple picture rules; immediate praise for following them'],['رویے کا معاہدہ اور پوائنٹ سسٹم؛ پرسکون ہونے کے مراحل؛ تعریف اور اصلاح کا تناسب تقریباً 4:1','Behaviour contract and point system; teach calming steps; about 4 praises per correction'],['نجی گفتگو، طالب علم کے ساتھ ہدف بندی، ہم عمر رہنما یا کونسلر سے رجوع','Private conferencing, goal setting with the student, peer mentor or counsellor referral']],

E:[['نظر اور سماعت کی جانچ کروائیں؛ والدین سے ملیں؛ نیند، خوراک اور حاضری دیکھیں؛ کونسلر سے مدد','Refer for vision and hearing screening; meet parents; check sleep, nutrition and attendance; counsellor support']]};

L:[['درجہ 2: ہفتے میں 3-5 دن، 20-30 منٹ، گروپ (3-5)، 8-12 ہفتے؛ متاثرہ شعبے پر اصلاحی تدریس','Tier 2: 20-30 min, 3-5 days/week, group of 3-5, 8-12 weeks; targeted remedial teaching in the flagged area'],10],
